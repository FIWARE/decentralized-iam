name: Check PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - master

# One run per pull request: opening a pull request with a label fires two events at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: ./.github/scripts/lint.sh

  eval:
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4.3.0
      - uses: bmuschko/setup-kubeconform@v1
        
      - name: Eval
        run: |
          .github/scripts/eval.sh

  # Requires a semver label and bumps the version of the charts the pull request changes, see
  # https://github.com/SEAMWARE/github-workflows
  chart-version:
    needs:
      - lint
      - eval
    uses: SEAMWARE/github-workflows/.github/workflows/chart-pr.yml@v1
    permissions:
      contents: write
      pull-requests: write
